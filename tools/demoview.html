<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../vendor/katex/katex.min.css"><link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
<style>body{background:var(--paper);padding:12px}.w{max-width:760px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}.w h6{margin:0;font-size:12px;color:var(--red)}</style></head>
<body><div class="w lesson-main" id="w"></div>
<script type="module">
// Review helper (not part of the course): demoview.html?names=a,b&lang=zh — mounts demos one under another.
const q = new URLSearchParams(location.search), names = (q.get("names") || "").split(",").filter(Boolean), lang = q.get("lang") || "zh";
document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
const w = document.getElementById("w");
for (const n of names) {
  const h = document.createElement("h6"); h.textContent = n; w.appendChild(h);
  const d = document.createElement("div"); d.className = "demo-host"; w.appendChild(d);
  try { (await import(`../demos/${n}.js?t=${Date.now()}`)).default(d, lang); } catch (e) { d.textContent = "ERROR " + e; }
}
</script></body></html>

<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
<style>body{background:var(--paper);padding:10px}.g{display:grid;grid-template-columns:repeat(2,640px);gap:10px}.c{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}.c h6{margin:0 0 4px;font-size:12px;color:var(--red)}.c svg{width:100%;height:auto;display:block}</style></head>
<body><div class="g lesson-main" id="g"></div>
<script type="module">
const q = new URLSearchParams(location.search), ids = q.get("ids").split(","), lang = q.get("lang") || "zh";
const g = document.getElementById("g");
for (const id of ids) {
  const src = await (await fetch(`../content/lessons/${lang}/${id}.md?t=${Date.now()}`)).text();
  const figs = src.match(/<figure[\s\S]*?<\/figure>/g) || [];
  figs.forEach((f, i) => { const d = document.createElement("div"); d.className = "c"; d.innerHTML = `<h6>${id} #${i + 1}</h6>` + f.replace(/<figcaption[\s\S]*?<\/figcaption>/, ""); g.appendChild(d); });
}
</script></body></html>
